<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Receiving Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: one-column lesson screen (header bar, question card, sticky check/feedback sheet), Duolingo-style pacing in WPU navy and pool-gold */
:root{
  --bg:#f4f7fb; --card:#ffffff; --ink:#0d1b33; --muted:#5b6b85; --line:#d9e1ec;
  --navy:#0a1d3a; --gold:#ffc93c; --gold-ink:#3b2a00;
  --good:#1f9d61; --good-bg:#dff5ea; --bad:#d6453d; --bad-bg:#fde5e3;
  --sel:#e7eefb; --sel-line:#2f5fb3;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071226; --card:#0f2142; --ink:#eef3fb; --muted:#9fb0cc; --line:#23395f;
  --navy:#cfe0ff; --gold:#ffc93c; --gold-ink:#3b2a00;
  --good:#43c983; --good-bg:#0f3a29; --bad:#ff7a70; --bad-bg:#43191a;
  --sel:#173062; --sel-line:#7fa7f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071226; --card:#0f2142; --ink:#eef3fb; --muted:#9fb0cc; --line:#23395f;
  --navy:#cfe0ff; --gold:#ffc93c; --gold-ink:#3b2a00;
  --good:#43c983; --good-bg:#0f3a29; --bad:#ff7a70; --bad-bg:#43191a;
  --sel:#173062; --sel-line:#7fa7f0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0}
.brandrow{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brandrow img{width:22px;height:auto}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 160px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .35s ease}
.stat{font-family:var(--display);font-weight:800;font-size:18px;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.combo{color:var(--bad)} .stat.xp{color:var(--gold-ink);background:var(--gold);padding:0 10px;border-radius:99px}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
.scenario{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:600;text-align:left;color:var(--ink);background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt b{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:14px;color:var(--muted)}
.opt:hover{background:var(--sel)}
.opt[aria-pressed="true"]{border-color:var(--sel-line);background:var(--sel)}
.opt[aria-pressed="true"] b{border-color:var(--sel-line);color:var(--sel-line)}
.opt.right{border-color:var(--good);background:var(--good-bg)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--sel-line);outline-offset:2px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.good{background:var(--good-bg);border-color:var(--good)} .sheet.bad{background:var(--bad-bg);border-color:var(--bad)}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:800;font-size:22px}
.sheet.good .verdict{color:var(--good)} .sheet.bad .verdict{color:var(--bad)}
.why{margin:0}
.btn{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.04em;text-transform:uppercase;border:0;border-bottom:5px solid rgba(0,0,0,.25);border-radius:16px;padding:12px 18px;cursor:pointer;background:var(--gold);color:var(--gold-ink);width:100%}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.sheet.good .btn{background:var(--good);color:#fff} .sheet.bad .btn{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);border-bottom-width:5px}
.end{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.badge{width:150px;height:150px;border-radius:50%;background:var(--gold);display:grid;place-items:center;border:6px solid var(--card);box-shadow:0 0 0 4px var(--gold)}
.badge svg{width:96px;height:96px}
.big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.actions{display:grid;gap:10px;width:100%}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head><body>

<script>
const QUIZ = {
  course: "1.3b Passing & Receiving",
  badge: "Receiving: Certified",
  pass: 8,
  questions: [
    {scen:"These questions are for a right-handed player. If you're a lefty, just flip left and right.",
     q:"The ball is about to be passed to you. What do you do first?",
     o:["Stop moving and wait","Egg beater faster to get ready for the ball","Raise both hands","Turn your back to the passer"],
     a:1, why:"Prepare before the ball arrives: speed up your egg beater so you're high and ready to receive it."},
    {q:"When the ball comes to you, who should be in control?",
     o:["The ball: let it come to you","You: you go to the ball and attack it","Your defender","Nobody, it depends on the pass"],
     a:1, why:"You control the ball, the ball doesn't control you. Go to the ball. We call it attacking the ball."},
    {scen:"You wait for the ball, it arrives and it pushes you a little to the left.",
     q:"What did you do wrong?",
     o:["You didn't attack the ball, so the ball took control of you","You attacked the ball too hard","You absorbed the ball","Nothing, that's normal"],
     a:0, why:"If the ball moves you, it's in control. Go to the ball and attack it, so you stay in control of the ball."},
    {q:"What happens when the ball lands in your hand?",
     o:["You squeeze it as hard as you can","You absorb it: let the ball take your arm back","You push it forward right away","You drop your arm into the water"],
     a:1, why:"Absorb the ball. Let it carry your arm back, like catching an egg, so it stays in your hand."},
    {scen:"You wait with your hand still and the ball bounces off your palm into the water.",
     q:"What did you forget?",
     o:["To absorb the ball","To close your eyes","To catch with two hands","To sink lower"],
     a:0, why:"A stiff hand makes the ball bounce off. Absorb it: let the ball take your arm back so it stays in your hand."},
    {q:"Receiving on the strong side: where are your legs?",
     o:["Straight down under you","Slightly to the side, facing toward the ball","Behind you, horizontal","Facing away from the ball"],
     a:1, why:"On the strong side, your legs are slightly to the side and face toward where the ball is coming from."},
    {q:"What is the right order for receiving on the strong side?",
     o:["Absorb, then attack, then prepare","Prepare with your egg beater, attack the ball, absorb it","Attack, then prepare","Just catch it, no order"],
     a:1, why:"Prepare (faster egg beater), attack the ball, absorb it. The same three steps every time."},
    {scen:"This is for a right-handed player. If you're a lefty, just switch sides.",
     q:"Receiving on the weak side: where does your left knee point?",
     o:["At the passer","Toward where you want to pass or shoot next","Down to the bottom of the pool","Behind you"],
     a:1, why:"Point your left knee toward where you want to pass or shoot next. Your body is already set up for the next play."},
    {q:"On the weak side, where do you receive the ball?",
     o:["Far out to the side","Right in front of your face","Behind your head","Under the water"],
     a:1, why:"Receive it right in front of your face. That's the spot you can control best on the weak side."},
    {q:"Why receive the weak-side ball in front of your face?",
     o:["So the defender can see it","So you can bring it back and be right away in the shooting position","So you can pass it with two hands","It doesn't matter where"],
     a:1, why:"From in front of your face, you bring the ball straight back and you're right away in the shooting position, ready to pass or shoot."}
  ]
};

const app = document.getElementById("app");
const sheet = document.getElementById("sheet");
const sheetIn = document.getElementById("sheetIn");
let order = [], i = 0, picked = null, score = 0, xp = 0, combo = 0, best = 0, missed = [], checked = false;

function start(list){
  order = list; i = 0; score = 0; xp = 0; combo = 0; best = 0; missed = [];
  show();
}
function header(){
  const pct = Math.round((i / order.length) * 100);
  return `<div class="top"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${order.length}" aria-valuenow="${i}"><i style="width:${pct}%"></i></div>
  <span class="stat combo" title="Correct answers in a row">🔥 ${combo}</span><span class="stat xp" title="Points">${xp} XP</span></div>`;
}
function show(){
  picked = null; checked = false;
  const Q = QUIZ.questions[order[i]];
  const letters = "ABCD";
  app.innerHTML = header() +
    `<div class="kicker">${QUIZ.course} · Question ${i+1} of ${order.length}</div>` +
    (Q.scen ? `<div class="scenario">${Q.scen}</div>` : "") +
    `<h1>${Q.q}</h1><div class="opts">` +
    Q.o.map((t,k)=>`<button class="opt" id="opt${k}" aria-pressed="false" data-k="${k}"><b>${letters[k]}</b><span>${t}</span></button>`).join("") +
    `</div>`;
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(checked) return;
    picked = +b.dataset.k;
    app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed", x===b ? "true":"false"));
    checkBtn.disabled = false;
  }));
  sheet.className = "sheet";
  sheetIn.innerHTML = `<button class="btn" id="check" disabled>Check</button>`;
  const checkBtn = document.getElementById("check");
  checkBtn.addEventListener("click", check);
}
function check(){
  if(picked===null) return;
  checked = true;
  const Q = QUIZ.questions[order[i]];
  const ok = picked === Q.a;
  app.querySelectorAll(".opt").forEach(b=>{
    b.disabled = true;
    const k = +b.dataset.k;
    if(k===Q.a) b.classList.add("right");
    else if(k===picked) b.classList.add("wrong");
  });
  if(ok){ score++; combo++; best=Math.max(best,combo); xp += 10 + (combo>=3 ? 5 : 0); }
  else { combo = 0; missed.push(order[i]); }
  app.querySelector(".top").outerHTML = header();
  sheet.className = "sheet " + (ok ? "good" : "bad");
  const lines = ok ? (combo>=3 ? `Nice! ${combo} in a row, +5 bonus XP.` : "Nice!") : "Not quite.";
  sheetIn.innerHTML = `<div class="verdict">${lines}</div>${ok?"":`<div><strong>Correct answer:</strong> ${Q.o[Q.a]}</div>`}<p class="why">${Q.why}</p><button class="btn" id="next">Continue</button>`;
  document.getElementById("next").addEventListener("click", ()=>{ i++; i < order.length ? show() : finish(); });
  document.getElementById("next").focus();
}
function finish(){
  const passed = score >= QUIZ.pass;
  sheet.className = "sheet"; sheetIn.innerHTML = "";
  sheet.hidden = true;
  app.innerHTML = `<div class="end">
    <div class="kicker">${QUIZ.course}</div>
    ${passed ? `<div class="badge" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="42" r="26" fill="#0a1d3a"/><path d="M50 16v52M24 42h52M31 24c10 10 10 26 0 36M69 24c-10 10-10 26 0 36" stroke="#ffc93c" stroke-width="4" fill="none"/><path d="M30 78q10-8 20 0t20 0" stroke="#0a1d3a" stroke-width="5" fill="none" stroke-linecap="round"/></svg></div>
      <h1>${QUIZ.badge}</h1>` : `<h1>Almost there</h1><p>You need ${QUIZ.pass} out of ${order.length} for the badge. Rewatch the lessons and try again.</p>`}
    <div class="big">${score} / ${order.length}</div>
    <div class="row"><span class="pill">${xp} XP</span><span class="pill">🔥 Best streak ${best}</span></div>
    <div class="actions">
      ${missed.length ? `<button class="btn" id="redo">Practice my ${missed.length} mistake${missed.length>1?"s":""}</button>` : ""}
      <button class="btn ghost" id="again">Take the quiz again</button>
    </div>
    <p>${passed ? "Go back to the course and click <strong>Mark as complete</strong>. Your certificate arrives by email." : ""} Post your score and your badge in the Waterpolo University community.</p>
  </div>`;
  const redo = document.getElementById("redo");
  if(redo) redo.addEventListener("click", ()=>{ sheet.hidden=false; start(missed.slice()); });
  document.getElementById("again").addEventListener("click", ()=>{ sheet.hidden=false; start(QUIZ.questions.map((_,k)=>k)); });
}
start(QUIZ.questions.map((_,k)=>k));
</script>
