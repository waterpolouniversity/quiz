<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Classic Cocktails Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: one-column lesson screen (header bar, question card, sticky check/feedback sheet), Duolingo-style pacing in WPU navy and pool-gold */
:root{
  --bg:#fbf6ec; --card:#ffffff; --ink:#101a3e; --muted:#5b6b85; --line:#e6dcc8;
  --navy:#101a3e; --gold:#f2a51a; --gold-ink:#2b1a00;
  --good:#1f9d61; --good-bg:#dff5ea; --bad:#d6453d; --bad-bg:#fde5e3;
  --sel:#eef1fa; --sel-line:#2a3d78;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1230; --card:#141f4a; --ink:#eef3fb; --muted:#9fb0cc; --line:#23395f;
  --navy:#e3e8f8; --gold:#f2a51a; --gold-ink:#2b1a00;
  --good:#43c983; --good-bg:#0f3a29; --bad:#ff7a70; --bad-bg:#43191a;
  --sel:#173062; --sel-line:#7fa7f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1230; --card:#141f4a; --ink:#eef3fb; --muted:#9fb0cc; --line:#23395f;
  --navy:#e3e8f8; --gold:#f2a51a; --gold-ink:#2b1a00;
  --good:#43c983; --good-bg:#0f3a29; --bad:#ff7a70; --bad-bg:#43191a;
  --sel:#173062; --sel-line:#7fa7f0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0}
.brandrow{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brandrow img{width:20px;height:auto}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 160px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .35s ease}
.stat{font-family:var(--display);font-weight:800;font-size:18px;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.combo{color:var(--bad)} .stat.xp{color:var(--gold-ink);background:var(--gold);padding:0 10px;border-radius:99px}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
.scenario{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:600;text-align:left;color:var(--ink);background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt b{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:14px;color:var(--muted)}
.opt:hover{background:var(--sel)}
.opt[aria-pressed="true"]{border-color:var(--sel-line);background:var(--sel)}
.opt[aria-pressed="true"] b{border-color:var(--sel-line);color:var(--sel-line)}
.opt.right{border-color:var(--good);background:var(--good-bg)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--sel-line);outline-offset:2px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.good{background:var(--good-bg);border-color:var(--good)} .sheet.bad{background:var(--bad-bg);border-color:var(--bad)}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:800;font-size:22px}
.sheet.good .verdict{color:var(--good)} .sheet.bad .verdict{color:var(--bad)}
.why{margin:0}
.btn{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.04em;text-transform:uppercase;border:0;border-bottom:5px solid rgba(0,0,0,.25);border-radius:16px;padding:12px 18px;cursor:pointer;background:var(--gold);color:var(--gold-ink);width:100%}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.sheet.good .btn{background:var(--good);color:#fff} .sheet.bad .btn{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);border-bottom-width:5px}
.end{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.badge{width:150px;height:150px;border-radius:50%;background:#ffffff;display:grid;place-items:center;border:6px solid var(--card);box-shadow:0 0 0 5px var(--gold)}
.badge img{width:96px;height:auto}
.big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.actions{display:grid;gap:10px;width:100%}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body>

const app = document.getElementById("app");
const sheet = document.getElementById("sheet");
const sheetIn = document.getElementById("sheetIn");
let order = [], i = 0, picked = null, score = 0, xp = 0, combo = 0, best = 0, missed = [], checked = false;

function start(list){
  order = list; i = 0; score = 0; xp = 0; combo = 0; best = 0; missed = [];
  show();
}
function header(){
  const pct = Math.round((i / order.length) * 100);
  return `<div class="top"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${order.length}" aria-valuenow="${i}"><i style="width:${pct}%"></i></div>
  <span class="stat combo" title="Correct answers in a row">🔥 ${combo}</span><span class="stat xp" title="Points">${xp} XP</span></div>`;
}
function show(){
  picked = null; checked = false;
  const Q = QUIZ.questions[order[i]];
  const letters = "ABCD";
  app.innerHTML = header() +
    `<div class="kicker">${QUIZ.course} · Question ${i+1} of ${order.length}</div>` +
    (Q.scen ? `<div class="scenario">${Q.scen}</div>` : "") +
    `<h1>${Q.q}</h1><div class="opts">` +
    Q.o.map((t,k)=>`<button class="opt" id="opt${k}" aria-pressed="false" data-k="${k}"><b>${letters[k]}</b><span>${t}</span></button>`).join("") +
    `</div>`;
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(checked) return;
    picked = +b.dataset.k;
    app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed", x===b ? "true":"false"));
    checkBtn.disabled = false;
  }));
  sheet.className = "sheet";
  sheetIn.innerHTML = `<button class="btn" id="check" disabled>Check</button>`;
  const checkBtn = document.getElementById("check");
  checkBtn.addEventListener("click", check);
}
function check(){
  if(picked===null) return;
  checked = true;
  const Q = QUIZ.questions[order[i]];
  const ok = picked === Q.a;
  app.querySelectorAll(".opt").forEach(b=>{
    b.disabled = true;
    const k = +b.dataset.k;
    if(k===Q.a) b.classList.add("right");
    else if(k===picked) b.classList.add("wrong");
  });
  if(ok){ score++; combo++; best=Math.max(best,combo); xp += 10 + (combo>=3 ? 5 : 0); }
  else { combo = 0; missed.push(order[i]); }
  app.querySelector(".top").outerHTML = header();
  sheet.className = "sheet " + (ok ? "good" : "bad");
  const lines = ok ? (combo>=3 ? `Nice! ${combo} in a row, +5 bonus XP.` : "Nice!") : "Not quite.";
  sheetIn.innerHTML = `<div class="verdict">${lines}</div>${ok?"":`<div><strong>Correct answer:</strong> ${Q.o[Q.a]}</div>`}<p class="why">${Q.why}</p><button class="btn" id="next">Continue</button>`;
  document.getElementById("next").addEventListener("click", ()=>{ i++; i < order.length ? show() : finish(); });
  document.getElementById("next").focus();
}
